global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prodml-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "prodml-service:8000"
        labels:
          environment: "production"
          service: "prodml-fastapi"
          app: "arabic-sentiment"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
