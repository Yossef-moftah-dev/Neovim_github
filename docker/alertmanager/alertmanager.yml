global:
  resolve_timeout: 1m

route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 2h
  receiver: "default_webhook_receiver"
  routes:
    - match:
        severity: critical
      receiver: "critical_alerts_receiver"
      repeat_interval: 30m
    - match:
        severity: warning
      receiver: "warning_alerts_receiver"
      repeat_interval: 1h

receivers:
  - name: "default_webhook_receiver"
    webhook_configs:
      - url: "http://prodml-service:8000/webhook/alerts"
        send_resolved: true

  - name: "critical_alerts_receiver"
    webhook_configs:
      - url: "http://prodml-service:8000/webhook/alerts/critical"
        send_resolved: true

  - name: "warning_alerts_receiver"
    webhook_configs:
      - url: "http://prodml-service:8000/webhook/alerts/warning"
        send_resolved: true
