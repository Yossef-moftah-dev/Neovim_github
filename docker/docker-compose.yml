services:
  postgres:
    image: postgres:16-alpine
    container_name: prodml-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - prodml-network

  minio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.minio
    image: prodml-minio:latest
    container_name: prodml-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - prodml-network

  create-buckets:
    image: prodml-minio:latest
    container_name: prodml-create-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...' && sleep 1;
      done;
      mc mb --ignore-existing local/mlflow;
      mc mb --ignore-existing local/dvc-storage;
      mc anonymous set public local/mlflow;
      mc anonymous set public local/dvc-storage;
      echo 'MinIO buckets initialized successfully.';
      exit 0;
      "
    restart: "no"
    networks:
      - prodml-network

  mlflow-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    image: prodml-mlflow-server:latest
    container_name: prodml-mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://mlflow:mlflow_password@postgres:5432/mlflow
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"
      --cors-allowed-origins "*"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - prodml-network

  download-model:
    image: python:3.12-slim
    container_name: prodml-model-downloader
    volumes:
      - ../outputs/final_model:/outputs/final_model
    command: >
      sh -c "
        if [ ! -f /outputs/final_model/model.safetensors ]; then
          echo 'Downloading fine-tuned weights from Google Drive...' &&
          pip install --no-cache-dir --quiet gdown &&
          python -m gdown --folder https://drive.google.com/drive/folders/1yeJcg-nrci3BDq01p9-pjtciv1c4g9rc -O /outputs/final_model;
        else
          echo 'Model weights already present.';
        fi &&
        chmod -R a+rX /outputs/final_model
      "
    restart: "no"
    networks:
      - prodml-network

  prodml-service:
    depends_on:
      download-model:
        condition: service_completed_successfully
      mlflow-server:
        condition: service_healthy
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${PRODML_IMAGE:-ghcr.io/yossef-moftah-dev/arabic-sentiment-arabert:latest}
    container_name: prodml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_DIR=/app/outputs/final_model
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - LOG_LEVEL=INFO
    volumes:
      - ../outputs/final_model:/app/outputs/final_model:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - prodml-network

  airflow-init:
    image: apache/airflow:2.9.2
    container_name: prodml-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://mlflow:mlflow_password@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --username admin --password admin --email admin@prodml.ai --firstname Admin --lastname User || true
    restart: "no"
    networks:
      - prodml-network

  airflow-webserver:
    image: apache/airflow:2.9.2
    container_name: prodml-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://mlflow:mlflow_password@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=prodml_secret_key_airflow_2026_dev
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    ports:
      - "8080:8080"
    volumes:
      - ../pipelines/dags:/opt/airflow/dags:ro
      - ../data:/opt/airflow/data
      - ../outputs:/opt/airflow/outputs
      - ../reports:/opt/airflow/reports
      - ../src:/opt/airflow/src:ro
      - ../scripts:/opt/airflow/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - prodml-network

  airflow-scheduler:
    image: apache/airflow:2.9.2
    container_name: prodml-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://mlflow:mlflow_password@postgres:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ../pipelines/dags:/opt/airflow/dags:ro
      - ../data:/opt/airflow/data
      - ../outputs:/opt/airflow/outputs
      - ../reports:/opt/airflow/reports
      - ../src:/opt/airflow/src:ro
      - ../scripts:/opt/airflow/scripts:ro
    networks:
      - prodml-network

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prodml-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - prodml-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: prodml-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - prodml-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: prodml-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - prodml-network

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  prodml-network:
    driver: bridge
