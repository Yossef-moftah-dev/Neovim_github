# ==============================================================================
# Nginx Canary Reverse Proxy Configuration
#
# Production traffic split:
#   - 95% Production Backend (port 8000 - Champion Model)
#   - 5% Canary Backend      (port 8001 - Candidate Model)
#
# Overrides:
#   - Request header 'X-Canary: always' -> routes directly to Canary
#   - Request header 'X-Canary: never'  -> routes directly to Production
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Logging with upstream timing telemetry
    log_format canary_format '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             'upstream: $upstream_addr '
                             'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/canary_access.log canary_format;
    error_log /var/log/nginx/canary_error.log warn;

    # Upstream Production Pool (Champion)
    upstream production_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # Upstream Canary Pool (Candidate)
    upstream canary_backend {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    # Dynamic 95/5 Traffic Splitting based on client IP & request ID
    split_clients "${remote_addr}${request_id}" $split_upstream {
        5%      canary_backend;
        *       production_backend;
    }

    # Header-based explicit routing override
    map $http_x_canary $chosen_upstream {
        "always" canary_backend;
        "never"  production_backend;
        default  $split_upstream;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://$chosen_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            # Telemetry response headers for downstream verification
            add_header X-Served-By $chosen_upstream always;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Response-Time $upstream_response_time always;
        }

        # Canary direct monitoring endpoint for rollback guard
        location /_canary_health {
            proxy_pass http://canary_backend/health;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }
    }
}
