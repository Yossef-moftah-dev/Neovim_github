name: CI

on:
  push:
    branches: [main, module-1-packaging]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check src/ tests/

      - name: Check Formatting
        run: uv run ruff format --check src/ tests/

      - name: Run Pytest with Coverage (>= 70%)
        run: uv run pytest --cov=src/prodml --cov-report=term-missing --cov-fail-under=70

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t prodml-service:ci .
