name: CI

on:
  push:
    branches: [main, module-2-tracking-automation, module-1-packaging]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Test & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check src/ tests/ scripts/

      - name: Check Formatting
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Run Pytest with Coverage (>= 70%)
        run: uv run pytest --cov=src/prodml --cov-report=term-missing --cov-fail-under=70

      - name: Enforce Model Quality Gate
        run: uv run python scripts/model_quality_gate.py --metrics reports/eval_metrics.json

  docker-build:
    name: Docker Build & Image Publishing
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (if secrets configured)
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TAGS="prodml-service:latest,prodml-service:${{ github.sha }}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,$DOCKERHUB_USERNAME/prodml-service:latest,$DOCKERHUB_USERNAME/prodml-service:${{ github.sha }}"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          load: ${{ steps.meta.outputs.push == 'false' }}
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
