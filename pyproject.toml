[project]
name = "prodml"
version = "0.3.0"
description = "Production Arabic sentiment platform with serving orchestration, BentoML micro-batching, and canary deployment"
readme = "README.md"
authors = [
    { name = "Yossef Moftah", email = "yossefmoftah000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "pydantic>=2.0.0",
    "onnx>=1.23.0",
    "onnxruntime>=1.20.0",
    "numpy>=1.26.0",
    "gdown>=6.4.0",
    "mlflow>=2.14.0",
    "boto3>=1.34.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "bentoml>=1.4.0",
    "locust>=2.30.0",
]

[project.scripts]
prodml-api = "prodml.api:start"
prodml-download = "prodml.download:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "httpx>=0.28.0",
    "onnxscript>=0.7.2",
    "dvc>=3.50.0",
    "dvc-s3>=3.0.0",
    "scikit-learn>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "httpx>=0.28.0",
    "onnxscript>=0.7.2",
    "dvc>=3.50.0",
    "dvc-s3>=3.0.0",
    "scikit-learn>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
