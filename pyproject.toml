[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-sentiment-arabert"
version = "0.1.0"
description = "Arabic e-commerce review sentiment classification with AraBERT: fine-tuning, distillation, and optimized serving."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["arabic", "nlp", "sentiment-analysis", "arabert", "pytorch", "mlflow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies (training + evaluation)
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate>=0.30",
    "arabert>=1.0.1",          # ArabertPreprocessor for AraBERT text cleaning
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "mlflow>=2.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]
# pip install -e ".[export]"  (ONNX / TensorRT phase)
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
# pip install -e ".[serve]"  (serving phase)
serve = [
    "bentoml>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------- Ruff (linting + formatting) ----------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["arabic_sentiment"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that download models or need a GPU (skipped in CI)",
]

# ---------- Coverage ----------
[tool.coverage.run]
source = ["src/arabic_sentiment"]
branch = true