[project]
name = "prodml"
version = "0.1.0"
description = "Production ML service and packaging for Arabic sentiment analysis"
readme = "README.md"
authors = [
    { name = "Yossef Moftah", email = "yossefmoftah000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "pydantic>=2.0.0",
    "onnx>=1.23.0",
    "onnxruntime>=1.20.0",
    "numpy>=1.26.0",
]

[project.scripts]
prodml-api = "prodml.api:start"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "httpx>=0.28.0",
    "onnxscript>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodml"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
