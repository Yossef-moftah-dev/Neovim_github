services:
  prodml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: prodml-service:latest
    pull_policy: build
    container_name: prodml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MODEL_DIR=/app/outputs/final_model
      - LOG_LEVEL=INFO
    volumes:
      - ./outputs/final_model:/app/outputs/final_model:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
